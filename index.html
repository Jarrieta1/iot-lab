<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard IoT</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --card: #1e293b;
        --primary: #38bdf8;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --border: rgba(148, 163, 184, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827 35%, #0f172a);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 40px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.5rem);
      }

      .status-pill {
        background: rgba(34, 197, 94, 0.14);
        color: #bbf7d0;
        border: 1px solid rgba(34, 197, 94, 0.35);
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 0.88rem;
        font-weight: 700;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 18px;
        margin-bottom: 28px;
      }

      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .stat-value {
        margin-top: 12px;
        font-size: clamp(1.5rem, 2.5vw, 2.2rem);
        font-weight: 700;
      }

      .stat-meta {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .panel {
        background: rgba(17, 24, 39, 0.95);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(148, 163, 184, 0.04);
      }

      .panel-header h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .last-update {
        color: var(--muted);
        font-size: 0.82rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }

      th {
        background: rgba(15, 23, 42, 0.8);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.8rem;
      }

      td {
        color: var(--text);
      }

      tbody tr:hover {
        background: rgba(56, 189, 248, 0.05);
      }

      .badge {
        display: inline-block;
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .badge-ok {
        background: rgba(34, 197, 94, 0.14);
        color: #bbf7d0;
      }
      .badge-warn {
        background: rgba(245, 158, 11, 0.14);
        color: #fcd34d;
      }
      .badge-danger {
        background: rgba(239, 68, 68, 0.14);
        color: #fca5a5;
      }

      .empty {
        padding: 24px 20px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .header {
          flex-direction: column;
          align-items: flex-start;
        }

        .panel-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }

        table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Dashboard IoT</h1>
        <div class="status-pill">Actualización automática</div>
      </div>

      <div class="stats">
        <div class="card">
          <div class="stat-label">Temperatura</div>
          <div id="tempValue" class="stat-value">--</div>
          <div class="stat-meta">°C actual</div>
        </div>

        <div class="card">
          <div class="stat-label">Humedad</div>
          <div id="humidityValue" class="stat-value">--</div>
          <div class="stat-meta">% actual</div>
        </div>

        <div class="card">
          <div class="stat-label">Registros</div>
          <div id="recordsValue" class="stat-value">--</div>
          <div class="stat-meta">Total en tabla</div>
        </div>

        <div class="card">
          <div class="stat-label">Estado</div>
          <div id="statusValue" class="stat-value">--</div>
          <div class="stat-meta">Servicio</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Registros recientes</h2>
          <span id="lastUpdate" class="last-update">Sin datos</span>
        </div>

        <div id="tableContainer"></div>
      </div>
    </div>

    <script>
      const API_URL = "/data";
      const REFRESH_INTERVAL = 15000;

      function getValueByKey(record, key) {
        if (!record) return "--";
        if (record[key] !== undefined && record[key] !== null)
          return record[key];

        const normalized = Object.keys(record).reduce((acc, item) => {
          acc[item.toLowerCase()] = record[item];
          return acc;
        }, {});

        if (normalized[key.toLowerCase()] !== undefined)
          return normalized[key.toLowerCase()];
        return "--";
      }

      function getStatusBadge(value) {
        if (value === "--")
          return '<span class="badge badge-warn">Sin datos</span>';
        const num = Number(value);
        if (Number.isNaN(num))
          return '<span class="badge badge-warn">En revisión</span>';
        if (num >= 25 && num <= 35)
          return '<span class="badge badge-ok">Normal</span>';
        if (num > 35 || num < 15)
          return '<span class="badge badge-danger">Alerta</span>';
        return '<span class="badge badge-warn">Advertencia</span>';
      }

      function renderTable(data) {
        const container = document.getElementById("tableContainer");

        if (!data || data.length === 0) {
          container.innerHTML =
            '<div class="empty">No hay registros disponibles.</div>';
          return;
        }

        const rows = data
          .map((item, index) => {
            const temperature = getValueByKey(item, "temperature");
            const humidity = getValueByKey(item, "humidity");
            const timestamp =
              getValueByKey(item, "timestamp") ||
              getValueByKey(item, "date") ||
              `Registro ${index + 1}`;
            const status = getStatusBadge(temperature);

            return `
            <tr>
              <td>${index + 1}</td>
              <td>${temperature}</td>
              <td>${humidity}</td>
              <td>${status}</td>
              <td>${timestamp}</td>
            </tr>
          `;
          })
          .join("");

        container.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Temperatura</th>
                <th>Humedad</th>
                <th>Estado</th>
                <th>Fecha/Hora</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      function updateDashboard(data) {
        const records = Array.isArray(data) ? data : [];

        const latest = records[records.length - 1] || {};
        const temperature = getValueByKey(latest, "temperature");
        const humidity = getValueByKey(latest, "humidity");

        document.getElementById("tempValue").textContent =
          temperature === "--" ? "--" : `${temperature}°C`;
        document.getElementById("humidityValue").textContent =
          humidity === "--" ? "--" : `${humidity}%`;
        document.getElementById("recordsValue").textContent = records.length;
        document.getElementById("statusValue").innerHTML =
          getStatusBadge(temperature);
        document.getElementById("lastUpdate").textContent =
          new Date().toLocaleTimeString("es-MX", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });

        renderTable(records);
      }

      async function fetchData() {
        try {
          const response = await fetch(API_URL);
          if (!response.ok) {
            throw new Error("No se pudo obtener la información");
          }

          const data = await response.json();
          updateDashboard(data);
        } catch (error) {
          console.error("Error al cargar datos:", error);
          document.getElementById("tableContainer").innerHTML =
            '<div class="empty">No se pudieron cargar los registros.</div>';
        }
      }

      fetchData();
      setInterval(fetchData, REFRESH_INTERVAL);
    </script>
  </body>
</html>
